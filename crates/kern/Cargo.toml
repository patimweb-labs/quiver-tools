[package]
name = "quiver-tools-kern"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
dirs = "6"
html-escape = "0.2"
keyring = "4"
open = "5"
rand = "0.9"
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
  "io-util",
  "io-std",
] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tempfile = "3"
