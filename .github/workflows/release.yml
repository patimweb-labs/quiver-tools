# Die Programme für alle Systeme, als GitHub-Release mit Prüfsummen —
# Versionierung übernimmt `release-please`.
#
#   Push nach main            release-please führt den Release-PR (Version in
#                             Cargo.toml und Cargo.lock, CHANGELOG.md), sonst
#                             nichts
#   Merge des Release-PR      release-please legt Tag und Release an, danach
#                             wird im **selben** Lauf gebaut, geprüft und
#                             angehängt
#   Tag vX.Y.Z (von Hand)     bauen, prüfen, Release anlegen (oder ergänzen),
#                             Archive anhängen
#   „Run workflow“            nur bauen; Archive liegen als Artefakte am Lauf
#   Pull Request              nur bauen, wenn die Paket-Skripte, dieser
#                             Workflow oder die Release-Konfiguration sich
#                             ändern (kein Release, keine Geheimnisse)
#
# Warum Tag und Bau in einem Lauf: Ein Tag, den `GITHUB_TOKEN` anlegt, löst
# **keine** weiteren Workflows aus. release-please erzeugt den Tag hier, also
# muss dieser Lauf auch bauen und veröffentlichen.
#
# Gebaut wird **nativ** auf dem jeweiligen Läufer, nicht über Kreuz: Rust unter
# Emulation braucht eine Stunde statt Minuten. Was hier passiert, steht in
# `verteilung/` und läuft lokal genauso:
#
#   verteilung/paket.sh          alle Programme bauen, strippen, signieren
#                                (macOS), als
#                                `dist/quiver-tools-<version>-<system>-<arch>.tar.gz`
#                                mit `LISTE.json` ablegen
#   verteilung/pruefen.sh        das Archiv entpacken, Summen prüfen und jedes
#                                Programm kurz starten (`--version`, `eintrag`,
#                                MCP `initialize`/`tools/list`)
#   verteilung/release-ziel.sh   was dieser Lauf mit Tag und Release tut
#
# Der Tag muss die Version aus `[workspace.package]` tragen — sonst hieße das
# Release anders als die Programme in ihrer eigenen Antwort.
#
# **Eine veröffentlichte Version wird nicht neu gebaut.** Trägt das Release zum
# Tag schon Archive, bricht `release-ziel.sh` ab, statt sie mit `--clobber` zu
# ersetzen; dieselbe Version ein zweites Mal ist ein Fehler. Die erste Fassung
# `v0.1.0` ist auf dem Weg vor release-please entstanden und bleibt, wie sie
# ist.
#
# **Keine Geheimnisse.** macOS wird ad hoc signiert; Gatekeeper fragt beim
# ersten Start nach. Windows braucht keine zusätzliche Laufzeit (statische
# C-Runtime, siehe `verteilung/paket.sh`). Auf Pull Requests werden keine
# Geheimnisse angefasst — es gibt keine.
#
# Rechte: oben leer, jeder Job nimmt sich Lesen; schreiben darf allein
# `release_please` (Inhalt, Pull Requests) und `veroeffentlichen` (Inhalt).
#
# Bedingungen: In einem Job **ohne** Statusfunktion prüft GitHub stillschweigend
# `success()` über **alle** Vorfahren. Ein übersprungener Job (etwa
# `release_please` bei einem Tag von Hand, bei einem Pull Request oder bei
# „Run workflow“) würde damit `version`, `pakete` und `veroeffentlichen`
# mitreißen. Deshalb steht überall ausdrücklich `!cancelled() &&
# needs.<job>.result == 'success' && …`; `!cancelled()` statt `always()`, weil
# ein abgebrochener Lauf auch nicht weiterbauen soll.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "verteilung/**"
  workflow_dispatch:

# Zwei Läufe am selben Tag würden sich die Dateien am Release streitig machen.
# Nicht abbrechen: ein halb hochgeladenes Release ist schlimmer als ein spätes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # `aws-lc-sys` (TLS in reqwest/rustls) bräuchte unter Windows sonst NASM.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  # Hält den Release-PR aktuell und legt beim Merge des Release-PR den Tag und
  # das GitHub-Release an. Die Version steht in `release-please-config.json`
  # (Cargo.toml und Cargo.lock), der Stand in `.release-please-manifest.json`.
  release_please:
    name: Release-PR und Tag
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Entscheidet, ob dieser Lauf nur baut oder auch veröffentlicht, und bricht
  # ab, wenn die Version schon veröffentlicht ist.
  version:
    name: Version und Tag
    needs: release_please
    # `skipped` ist der Normalfall: bei einem Tag von Hand, einem Pull Request
    # und „Run workflow“ läuft release-please nicht.
    if: "!cancelled() && (needs.release_please.result == 'success' || needs.release_please.result == 'skipped')"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      veroeffentlichen: ${{ steps.v.outputs.veroeffentlichen }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prüfen, ob die Version schon veröffentlicht ist
        id: v
        env:
          EREIGNIS: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RP_RELEASED: ${{ needs.release_please.outputs.released }}
          RP_TAG: ${{ needs.release_please.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Erst in eine Datei: `release-ziel.sh` schreibt nur `schlüssel=wert`
          # auf die Standardausgabe, seine Erklärungen gehen nach stderr.
          verteilung/release-ziel.sh > ziel.txt
          cat ziel.txt >> "$GITHUB_OUTPUT"
          cat ziel.txt

  # Nativ auf dem jeweiligen Läufer gebaut, kein Cross-Compile.
  #
  # `fail-fast: false`: ein gescheitertes Linux ist kein Grund, macOS nicht
  # zu bauen — so steht in einem Lauf da, **welche** Plattformen brechen. Der
  # Lauf bleibt rot, und weil `veroeffentlichen` `needs.pakete.result ==
  # 'success'` verlangt, wird dann nichts veröffentlicht.
  pakete:
    name: Archiv ${{ matrix.name }}
    needs: version
    # Auf einem Push nach main ohne neues Release gibt es nichts zu bauen.
    # Gebaut wird auf jedem Weg, der Archive liefern kann: Tag von Hand,
    # gemergter Release-PR, Pull Request und „Run workflow“.
    if: "!cancelled() && needs.version.result == 'success' && (needs.version.outputs.veroeffentlichen == 'ja' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')"
    strategy:
      # Ein gescheitertes Linux ist kein Grund, macOS nicht zu bauen — so steht
      # in einem Lauf da, **welche** Plattformen brechen.
      fail-fast: false
      matrix:
        include:
          # Der Name ist `system-arch` wie im Archiv; der Schritt „Bauen“
          # prüft, dass der Läufer wirklich das gebaut hat, was hier steht.
          - { name: macos-aarch64, os: macos-latest }
          # Intel auf einem Intel-Läufer; ARM kann das nicht bauen.
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-2025 }
          # 22.04: ältere glibc (2.35) — die Programme laufen damit auch auf
          # älteren Systemen, nicht nur auf dem neuesten.
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      - name: Bauen, strippen, paketieren
        shell: bash
        env:
          ERWARTET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          verteilung/paket.sh
          # `paket.sh` bestimmt System und Architektur aus `uname`. Weicht der
          # Läufer von der Matrix ab (etwa ein ARM-Image, das x86_64 meldet),
          # fällt es hier auf statt erst am Release.
          if ! ls dist/*-"$ERWARTET".tar.gz >/dev/null 2>&1; then
            echo "::error::Kein Archiv für $ERWARTET — der Läufer passt nicht zur Matrix."
            ls -la dist
            exit 1
          fi

      # Der Startbeweis: `--version`, `eintrag` und MCP über Pipes. Läuft auf
      # dem Archiv, nicht auf `target/` — geprüft wird, was ausgeliefert wird.
      - name: Programme prüfen
        shell: bash
        run: verteilung/pruefen.sh dist/quiver-tools-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: archiv-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: dist/*.tar.gz

  # Der einzige Job mit Schreibrechten am Release: Prüfsummen und Release.
  veroeffentlichen:
    name: Prüfsummen und Release
    needs: [version, pakete]
    # Nur mit Tag **und** mit allen gebauten Archiven. Bei einem Pull Request,
    # bei „Run workflow“ und bei einem Push nach main ohne neues Release setzt
    # `version` `veroeffentlichen=nein`; hier wird dann nichts angelegt und
    # nichts hochgeladen.
    if: "!cancelled() && needs.version.result == 'success' && needs.pakete.result == 'success' && needs.version.outputs.veroeffentlichen == 'ja'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archiv-*
          path: aus

      - name: Archive einsammeln
        run: |
          set -euo pipefail
          mkdir -p release
          find aus -type f -name '*.tar.gz' -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Keine Archive da — die Bau-Jobs sind gescheitert."
            exit 1
          fi
          ls -la release

      - name: Prüfsummen
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          # Die Größe je Archiv für den Release-Text. Bewusst **außerhalb** von
          # `release/`: sonst läge die Tabelle als weiteres Anhängsel ohne
          # Prüfsumme daneben. Und bewusst nur `*.tar.gz`: `SHA256SUMS` liegt
          # sonst mit in der Tabelle.
          {
            echo "| Datei | Größe |"
            echo "| --- | --- |"
            for datei in *.tar.gz; do
              printf "| %s | %s |\n" "$datei" "$(du -h --apparent-size "$datei" | cut -f1)"
            done
          } > ../groessen.md
          cat ../groessen.md

      - name: Release-Text schreiben
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Der Text steht ohne Ausdrücke in der Datei (»@VERSION@« statt
          # »$VERSION«), damit auf dem Weg nichts doppelt ausgewertet wird; die
          # Marke ersetzt `sed` am Ende. Die Größentabelle dazwischen kommt aus
          # `groessen.md`.
          cat > release-notizen.md <<'TEXT'
          ## quiver-tools @VERSION@

          Die MCP-Werkzeuge als einzelne Programme, je System ein Archiv:

          | System | Architektur |
          |---|---|
          | macOS | `aarch64` (Apple Silicon), `x86_64` (Intel) |
          | Linux | `x86_64`, `aarch64` |
          | Windows | `x86_64` |

          In jedem Archiv liegen die Programme flach nebeneinander und
          `LISTE.json` mit Name, Version, Größe und SHA-256 je Programm. Der
          quiver-Server übernimmt die Archive und liefert jedem Gerät die
          Programme, die ihm zugewiesen sind. `quiver-<tool> eintrag` zeigt den
          Bibliothekseintrag.

          Jedes Programm wurde auf seinem System gestartet: `--version`,
          `eintrag` und ein MCP-Handschlag über Pipes (`initialize`,
          `tools/list`).

          macOS ist **ad hoc signiert**: Gatekeeper fragt beim ersten Start nach
          einer Bestätigung — Rechtsklick → *Öffnen* oder *Systemeinstellungen →
          Datenschutz & Sicherheit → „Dennoch öffnen“*. Windows braucht keine
          zusätzliche Laufzeit.

          ### Größen

          TEXT
          cat groessen.md >> release-notizen.md
          cat >> release-notizen.md <<'TEXT'

          ### Prüfen

          ```bash
          sha256sum -c SHA256SUMS
          ```
          TEXT
          # `sed … > neu` statt `sed -i`: die BSD-Variante unter macOS nimmt
          # hinter `-i` einen Sicherungs-Zusatz an, GNU nicht. Der Lauf ist
          # ohnehin ubuntu — aber geprüft wird der Schritt auch lokal.
          sed "s|@VERSION@|$VERSION|g" release-notizen.md > release-notizen.neu
          mv release-notizen.neu release-notizen.md
          cat release-notizen.md

      # Ergänzt ein vorhandenes Release (release-please hat den Text
      # geschrieben) und legt sonst eines an. Der eigene Block steht unter einer
      # Marke: so bleiben die Notizen von release-please erhalten, und ein
      # zweiter Lauf ersetzt den Block, statt ihn zu verdoppeln.
      #
      # `gh release upload` **ohne** `--clobber`: gibt es die Datei schon, endet
      # der Schritt mit einem Fehler. Ein bestehendes Release wird nicht
      # überschrieben — `verteilung/release-ziel.sh` hat vorher schon geprüft,
      # dass zu diesem Tag keine Archive liegen.
      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > vorhanden.md
            sed '/<!-- quiver-tools-pakete -->/,$d' vorhanden.md > release-notizen.neu
            printf '\n%s\n' '<!-- quiver-tools-pakete -->' >> release-notizen.neu
            cat release-notizen.md >> release-notizen.neu
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file release-notizen.neu
          else
            { printf '%s\n\n' '<!-- quiver-tools-pakete -->'; cat release-notizen.md; } > release-notizen.neu
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file release-notizen.neu --verify-tag
          fi
          gh release upload "$TAG" release/* -R "$GITHUB_REPOSITORY"
