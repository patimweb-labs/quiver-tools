[package]
name = "quiver-zep"
description = "ZEP über den offiziellen ZEP-MCP als MCP-Tool: Werkzeuge durchgereicht, dauerhaft angemeldet."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "quiver-zep"
path = "src/main.rs"

[dependencies]
quiver-tools-kern = { path = "../kern" }
anyhow = "1"
base64 = "0.22"
keyring = "4"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rmcp = { version = "3.11", features = [
  "client",
  "macros",
  "schemars",
  "server",
  "transport-io",
  "transport-streamable-http-client-reqwest",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
] }
tracing = "0.1"
url = "2"

[dev-dependencies]
axum = "0.8"
rmcp = { version = "3.11", features = [
  "client",
  "macros",
  "schemars",
  "server",
  "transport-io",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
tempfile = "3"
tokio = { version = "1", features = [
  "io-util",
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
] }
tokio-util = "0.7"
