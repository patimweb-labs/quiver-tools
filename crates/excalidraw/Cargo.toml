[package]
name = "quiver-excalidraw"
description = "Excalidraw-Dateien als MCP-Tool: erzeugen, lesen, ändern, als Bild ausgeben."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "quiver-excalidraw"
path = "src/main.rs"

[dependencies]
quiver-tools-kern = { path = "../kern" }
quiver-diagramm = { path = "../diagramm" }
anyhow = "1"
# Das PNG geht als MCP-Bildinhalt zurück.
base64 = "0.22"
# Öffnet excalidraw.com im Standardbrowser – feste Adresse, keine Shell.
open = "5"
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# Zahlen exakt lesen und schreiben: Unberührtes bleibt bytegleich.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
