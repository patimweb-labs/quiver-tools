[package]
name = "quiver-drawio"
description = "draw.io als MCP-Tool: .drawio-Dateien lesen, ändern, zeichnen und im Browser öffnen."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "quiver-drawio"
path = "src/main.rs"

[dependencies]
quiver-tools-kern = { path = "../kern" }
quiver-diagramm = { path = "../diagramm" }
anyhow = "1"
# draw.io speichert Seiten Base64-kodiert und raw-deflate-komprimiert.
base64 = "0.22"
flate2 = "1"
# Der Browser-Start ohne Shell (Aufgabe 18); im Test nie benutzt.
open = "5"
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
