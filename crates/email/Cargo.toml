[package]
name = "quiver-email"
description = "E-Mail über IMAP und SMTP als MCP-Tool: lesen, suchen, senden, sortieren."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "quiver-email"
path = "src/main.rs"

[dependencies]
quiver-tools-kern = { path = "../kern" }
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
mail-parser = "1"
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
webpki-roots = "1"
