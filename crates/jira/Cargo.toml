[package]
name = "quiver-jira"
description = "Jira Cloud als MCP-Tool: Vorgänge lesen, suchen, anlegen, ändern und verknüpfen je Site."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "quiver-jira"
path = "src/main.rs"

[dependencies]
quiver-tools-kern = { path = "../kern" }
anyhow = "1"
# rustls + die Wurzeln des System-Zertifikatsspeichers: damit erkennt der Client
# Firmen-Proxy-CAs, ohne dass der User etwas abschaltet.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
  "json",
] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
# Adresse prüfen (nur https, Loopback für die Attrappe) und den Host einer
# Folgeseite vergleichen.
url = "2"

[dev-dependencies]
# Die Jira-Attrappe ist ein kleines axum-Programm (SPEC §7).
axum = "0.8"
# Für den `Authorization`-Kopf in den Tests: Basic = base64("email:token").
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
